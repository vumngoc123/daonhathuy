<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Dao Nhat Huy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <a href="index.html">About</a>
      <a href="hobbies.html">Hobbies</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

<div class="container" style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
    <h2>Send me a message</h2>
    <form action="#" method="post">
        <label>Your Name:</label>
        <input type="text" name="name" required style="display: block; width: 100%; margin-bottom: 10px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">

        <label>Your Email:</label>
        <input type="email" name="email" required style="display: block; width: 100%; margin-bottom: 10px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">

        <label>Your Message:</label>
        <textarea name="message" rows="4" required style="display: block; width: 100%; margin-bottom: 10px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></textarea>

        <button type="submit" style="display: block; width: 100%; padding: 10px; border-radius: 5px; background-color: #007BFF; color: white; border: none;">Send</button>
    </form>
</div>

  <footer>
    <p>&copy; 2025 Dao Nhat Huy</p>
  </footer>
</body>
</html>
